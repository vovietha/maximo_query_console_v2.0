<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMO SQL QUERY CONSOLE</title>
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navbar -->
    <div class="navbar">
        <div class="nav-brand">
            <h1>MAXIMO SQL QUERY CONSOLE</h1>
        </div>
        
        <!-- Gom 2 nút vào thẻ nav-actions để đẩy sang góc phải -->
        <div class="nav-actions">
            <button class="btn-theme-toggle" id="btnThemeToggle" data-action="toggleTheme" title="Đổi giao diện Tối/Sáng">🌙 Tối</button>
            <button class="btn-reload-schema" data-action="reloadSchema" title="Tải lại Schema từ CSDL">
                🔄 Tải lại Schema
            </button>
            <button class="btn-config" id="btn-config" data-action="openConfigModal">
                ⚙️ Cấu hình kết nối
            </button>
        </div>
    </div>

    <!-- Main Console Layout -->
    <div class="container">
        <div class="main-panel">
            <!-- Multi-tab bar -->
            <div class="tab-bar-container">
                <div class="tab-bar" id="tabBar"></div>
                <button class="btn-add-tab" data-action="addTab" title="Mở Tab Mới">+</button>
            </div>

            <!-- SQL Editor Container -->
            <div class="editor-container">
                <!-- Thanh Find & Replace chuẩn DataGrip -->
                <div id="searchReplaceBar" class="search-replace-bar" style="display: none;">
                    <div class="srb-row srb-search-row">
                        <button class="srb-btn-toggle-replace" id="btnToggleReplace" data-action="toggleReplaceRow" title="Hiện/Ẩn thanh Thay thế (Replace)">▼</button>
                        <div class="srb-input-wrapper">
                            <span class="srb-icon">🔍</span>
                            <input type="text" id="findInput" data-input-action="performSearch" placeholder="Search" />
                            <div class="srb-options">
                                <button class="srb-opt-btn" id="optMatchCase" data-action="toggleSearchOption" data-option="case" title="Match Case (Cc)">Cc</button>
                                <button class="srb-opt-btn" id="optWholeWord" data-action="toggleSearchOption" data-option="word" title="Words (W)">W</button>
                                <button class="srb-opt-btn" id="optRegex" data-action="toggleSearchOption" data-option="regex" title="Regex (.*)">.*</button>
                            </div>
                        </div>
                        <span class="srb-count" id="searchCount">0 results</span>
                        <div class="srb-nav-btns">
                            <button class="srb-btn" data-action="findPrev" title="Kết quả trước (Shift+Enter)">↑</button>
                            <button class="srb-btn" data-action="findNext" title="Kết quả tiếp (Enter)">↓</button>
                        </div>
                        <button class="srb-close-btn" data-action="closeSearchBar" title="Đóng (Esc)">&times;</button>
                    </div>
                    <div class="srb-row srb-replace-row" id="replaceRow" style="display: none;">
                        <div class="srb-input-wrapper">
                            <span class="srb-icon">✏️</span>
                            <input type="text" id="replaceInput" placeholder="Replace" />
                        </div>
                        <div class="srb-action-btns">
                            <button class="srb-btn srb-btn-action" data-action="doReplace">Replace</button>
                            <button class="srb-btn srb-btn-action" data-action="doReplaceAll">Replace All</button>
                        </div>
                    </div>
                </div>

                <textarea id="sqlEditor"></textarea>
            </div>
            
            <!-- SQL Execution Toolbar -->
            <div class="toolbar">
                <div class="toolbar-group">
                    <button class="btn btn-run" id="btn-execute" data-action="runQuery" data-page="1" title="Thực thi SQL (Ctrl+Enter)">▶ Chạy</button>
                    <button class="btn btn-commit" id="btn-commit" data-action="executeCommand" data-command="COMMIT" title="Commit giao dịch">Commit</button>
                    <button class="btn btn-rollback" id="btn-rollback" data-action="executeCommand" data-command="ROLLBACK" title="Rollback giao dịch">Rollback</button>
                </div>

                <div class="toolbar-divider"></div>

                <div class="toolbar-group">
                    <button class="btn btn-format" id="btn-format" data-action="formatSql" title="Định dạng SQL chuẩn">🧹 Format</button>
                    <button class="btn btn-fav" id="btn-fav" data-action="saveCurrentQueryToFavorites" title="Lưu Query yêu thích">⭐ Lưu</button>
                </div>

                <div class="toolbar-divider"></div>

                <div class="toolbar-group">
                    <label class="safe-mode-toggle" title="Chặn lệnh DML (UPDATE/DELETE)">
                        <input type="checkbox" id="safeModeCheck" data-action="toggleSafeMode" checked>
                        <span class="slider"></span>
                        <span class="label-text">🛡️ Safe Mode</span>
                    </label>

                    <div class="auto-limit-box" title="Giới hạn số bản ghi ROWNUM">
                        <label class="auto-limit-toggle">
                            <input type="checkbox" id="autoLimitCheck">
                            <span>⚡ Limit:</span>
                        </label>
                        <input type="number" id="autoLimitValue" class="auto-limit-input" value="200" min="1" max="100000" step="100" />
                    </div>
                </div>
            </div>

            <div id="msgBox" class="msg-box"></div>

            <!-- Results Panel (Controls moved to Header) -->
            <div class="results-panel">
                <div class="results-header">
                    <div class="results-title">
                        <span>📊 Kết quả truy vấn</span>
                        <div id="queryStats" class="query-stats"></div>
                    </div>
                    
                    <div class="results-actions">
                        <button class="btn btn-toggle" id="btn-toggle-view" data-action="toggleView" title="Đổi giao diện Bảng/JSON">👁️ View</button>
                        <button class="btn btn-excel" id="btn-export" data-action="exportExcel" title="Xuất dữ liệu trang hiện tại (tối đa 50 dòng)">📥 Excel</button>
                        
                        <div class="toolbar-divider"></div>
                        
                        <input type="text" id="filterInput" class="filter-input" data-input-action="renderResults" placeholder="🔍 Lọc trong trang hiện tại..." />
                        
                        <div class="pagination-widget">
                            <button class="pg-btn" id="btnPrev" data-action="changePage" data-delta="-1" disabled title="Trang trước">‹</button>
                            <span class="pg-label" id="pageLabel">Trang 1</span>
                            <button class="pg-btn" id="btnNext" data-action="changePage" data-delta="1" disabled title="Trang sau">›</button>
                        </div>
                    </div>
                </div>

                <div id="resultsContainer" class="results-container">
                    <div id="placeholder-text">Nhập câu lệnh SQL và bấm "Chạy Query" để xem kết quả</div>
                </div>
            </div>
        </div>

        <!-- Sidebar Lịch sử & CSDL -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-tabs">
                    <button class="sb-tab active" id="sbTabSchema" data-action="switchSidebarTab" data-tab="SCHEMA" title="CSDL Schema">🗄️ <span class="tab-label">CSDL</span></button>
                    <button class="sb-tab" id="sbTabHistory" data-action="switchSidebarTab" data-tab="HISTORY" title="Lịch sử Query">📜 <span class="tab-label">Lịch sử</span></button>
                    <button class="sb-tab" id="sbTabFav" data-action="switchSidebarTab" data-tab="FAV" title="Yêu thích">⭐ <span class="tab-label">Yêu thích</span></button>
                </div>
                <button class="btn-toggle-sidebar" id="btnToggleSidebar" data-action="toggleSidebar" title="Thu gọn / Mở rộng Sidebar">◄</button>
            </div>
             
            <!-- Panel 1: Schema Browser -->
            <div id="panelSchema" class="sidebar-panel">
                <input type="text" id="schemaSearchInput" class="filter-input schema-filter" data-input-action="filterSchemaTree" placeholder="🔍 Tìm bảng/cột Maximo..." />
                <div id="schemaTreeList" class="schema-tree-list"></div>
            </div>

            <!-- Panel 2: Lịch sử Query -->
            <div id="panelHistory" class="sidebar-panel" style="display: none;">
                <div id="historyList" class="history-list"></div>
            </div>

            <!-- Panel 3: Query Yêu thích -->
            <div id="panelFav" class="sidebar-panel" style="display: none;">
                <div id="favList" class="history-list"></div>
            </div>
        </div>
    </div>

    <!-- Status Bar Footer -->
    <div class="statusbar">
        <div class="status-item" id="statusConn">
            <span class="status-dot disconnected" id="statusDot"></span>
            <span id="statusHostText">Chưa kết nối Maximo</span>
        </div>
        <div class="status-item ml-auto">
            <span id="statusContextText">Context: maximo</span>
            <span class="status-divider">|</span>
            <span id="statusLimitText">Limit: 200</span>
            <span class="status-divider">|</span>
            <span>UTF-8</span>
        </div>
    </div>

    <!-- Popup Modal Cấu hình -->
    <div id="configModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cấu hình kết nối Maximo</h3>
                <span class="close-btn" data-action="closeConfigModal">&times;</span>
            </div>
            <div class="form-group">
                <label>Maximo Host (bao gồm Port):</label>
                <input type="text" id="cfgHost" placeholder="VD: http://cmms.pvpgb.vn:9080" />
            </div>
            <div class="form-group">
                <label>Context Path (Default: maximo):</label>
                <input type="text" id="cfgContext" placeholder="VD: maximo hoặc max76" />
            </div>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="cfgUser" placeholder="VD: maxadmin" />
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="cfgPass" placeholder="Nhập password" />
            </div>
            <button class="btn btn-run" style="width: 100%; margin-top: 10px;" data-action="saveConfig">Lưu cấu hình</button>
        </div>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
